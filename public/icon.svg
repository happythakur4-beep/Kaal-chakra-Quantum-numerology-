<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1429" />
      <stop offset="60%" stop-color="#0a0a14" />
      <stop offset="100%" stop-color="#050508" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle for Android Adaptive Icon -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)" />

  <!-- Outer Sacred Geometry Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.6" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="224" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.4" />
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.8" />

  <!-- 12 Zodiac Rays -->
  <g stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.4">
    <line x1="256" y1="20" x2="256" y2="492" />
    <line x1="20" y1="256" x2="492" y2="256" />
    <line x1="89" y1="89" x2="423" y2="423" />
    <line x1="89" y1="423" x2="423" y2="89" />
    <line x1="40" y1="147" x2="472" y2="365" />
    <line x1="40" y1="365" x2="472" y2="147" />
    <line x1="147" y1="40" x2="365" y2="472" />
    <line x1="365" y1="40" x2="147" y2="472" />
  </g>

  <!-- Sri Yantra Central Triangles & Kaal Chakra Wheel -->
  <g filter="url(#goldGlow)">
    <!-- Upward Triangles -->
    <polygon points="256,70 380,285 132,285" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.9" />
    <polygon points="256,110 355,280 157,280" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.8" />
    <polygon points="256,150 330,275 182,275" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.75" />

    <!-- Downward Triangles -->
    <polygon points="256,442 132,227 380,227" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.9" />
    <polygon points="256,402 157,232 355,232" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.8" />
    <polygon points="256,362 182,237 330,237" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.75" />

    <!-- Central Bindu (Cosmic Singularity) -->
    <circle cx="256" cy="256" r="14" fill="url(#goldGrad)" />
    <circle cx="256" cy="256" r="26" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
  </g>

  <!-- Tesla 3-6-9 Nodes -->
  <circle cx="256" cy="70" r="10" fill="#38bdf8" />
  <circle cx="380" cy="285" r="10" fill="#a855f7" />
  <circle cx="132" cy="285" r="10" fill="#ec4899" />
  <circle cx="256" cy="442" r="10" fill="#38bdf8" />
  <circle cx="132" cy="227" r="10" fill="#a855f7" />
  <circle cx="380" cy="227" r="10" fill="#ec4899" />
</svg>
